name: Release

# 推 v 开头的 tag 即自动发版；手动运行只构建产物（不发版，方便先验证）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 同一个 tag 的重复推送不并发发布
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: windows
            label: Windows x64
            os: windows-latest
            args: "--bundles nsis,msi"
          - key: macos
            label: macOS Universal
            os: macos-latest
            # Intel + Apple Silicon 合并成一个 .app / .dmg
            args: "--target universal-apple-darwin --bundles app,dmg"
          - key: linux
            label: Linux x64
            os: ubuntu-22.04
            args: "--bundles deb,appimage"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # macOS 通用包需要两个架构的 Rust 标准库
      - name: Rust toolchain (macOS universal)
        if: matrix.key == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust toolchain
        if: matrix.key != 'macos'
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tag 是版本号的来源：v1.2.3 → 写进 package.json / tauri.conf.json / Cargo.toml
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"

      - name: Build bundles
        run: pnpm tauri build ${{ matrix.args }}

      # 三平台产物统一交给 release job 汇总，避免三个 job 抢着建同一个 Release
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}-bundles
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 是为了拿 tag 与提交历史来生成变更清单
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"

          cat > notes.md <<'EOF'
          ## 安装包

          | 平台 | 文件 |
          | --- | --- |
          | Windows x64 | `*-setup.exe`（NSIS 安装包）或 `*.msi` |
          | macOS Universal（Intel + Apple Silicon） | `*.dmg` |
          | Linux x64 | `*.AppImage`（先 `chmod +x`）或 `*.deb` |

          > macOS 包未签名：首次打开若提示「无法验证开发者」，请右键 →「打开」，或在「系统设置 → 隐私与安全性」里允许。
          > 程序是便携式的：配置、项目、frp 版本都写在程序所在目录（macOS 为 `.app` 旁边），整个目录拷走即可迁移。

          ## 本次变更

          EOF

          if [ -n "$prev" ]; then
            printf '自 `%s` 起：\n\n' "$prev" >> notes.md
            git log --no-merges --pretty='- %s (%h)' "${prev}..${tag}" >> notes.md
          else
            printf '首次发布：\n\n' >> notes.md
            git log --no-merges --pretty='- %s (%h)' --max-count=200 "$tag" >> notes.md
          fi

          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FRP Tunnel Manager ${{ github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
